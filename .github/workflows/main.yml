name: Build React App
on: [push]  # Runs on every push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Check out your repo

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Use your Node.js version

      - name: Install dependencies (Client)
        run: |
          cd client  # Go to your React app
          npm install

      - name: Build React App
        run: |
          cd client
          npm run build  # Generates /client/build

      - name: Upload build artifacts (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: client/build  # Save build for later
